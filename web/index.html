<!-- 加载顺序：数据 → 核心 → 模块（模块的 tick 按这里的顺序执行） -->
<!-- 数值设置（改平衡只改这个） -->
<script>
  // 数值文件写错（语法错误）时在页面顶部提示是哪个文件、第几行
  window.addEventListener("error", function (e) {
    if (!e.filename || window.__noCfg) return;
    var b = document.getElementById("cfg-err") || document.body.insertBefore(Object.assign(document.createElement("div"), { id: "cfg-err" }), document.body.firstChild);
    b.style.cssText = "background:#7a1f1f;color:#fff;padding:8px;font-size:13px;white-space:pre-wrap";
    b.textContent += "脚本错误：" + e.filename.split("/").slice(-2).join("/").split("?")[0] + " 第 " + e.lineno + " 行：" + e.message + "\n";
  });
</script>
<!-- 游戏参数（js/config/）：由服务器按顺序加载，管理员「数据修改」改过的优先 -->
<script src="api/config-loader.js"></script>
<script>
  // 参数没加载到（多半是服务器正在更新 / 重启，或网络断了）：不报一堆脚本错误，提示后手动重试。
  // 只自动重试一次（sessionStorage 记一次）：避免服务器一直没好时无限 3 秒刷新刷下去；
  // 自动重试也失败就只留手动重试按钮，等玩家自己点。参数加载成功就把标记清掉，
  // 下次再出问题还能再自动重试一次。
  if (!window.CFG) {
    window.__noCfg = true;
    var cfgErr = document.createElement("div");
    cfgErr.style.cssText = "background:#7a1f1f;color:#fff;padding:10px;font-size:14px;text-align:center";
    cfgErr.textContent = "连接服务器失败（可能正在更新），请检查网络后重试。";
    var cfgBtn = document.createElement("button");
    cfgBtn.textContent = "手动重试";
    cfgBtn.style.cssText = "margin-left:10px;padding:4px 14px;font-size:14px";
    cfgBtn.onclick = function () { location.reload(); };
    cfgErr.appendChild(cfgBtn);
    document.body.insertBefore(cfgErr, document.body.firstChild);
    try {
      if (!sessionStorage.getItem("xiu_cfg_retry")) {
        sessionStorage.setItem("xiu_cfg_retry", "1");
        setTimeout(function () { location.reload(); }, 3000);
      }
    } catch (e) {}   // sessionStorage 不可用：不自动重试，只留手动按钮
  } else {
    try { sessionStorage.removeItem("xiu_cfg_retry"); } catch (e) {}
  }
</script>

<script>
  // 图片常驻：界面刷新会重建 <img>，安卓包里的图没有缓存标记，重建时要重新读、重新解码，会闪一下。
  // 这里把显示过的图片（<img> 和 style 里的 background url）各留一个 Image 对象在内存里，同一张图再出现时直接显示。
  // 只在浏览器里运行（服务器不执行内联脚本）；最多留 KEEP_MAX 张，超出先丢最早的。
  (function () {
    if (typeof document === "undefined" || !window.MutationObserver) return;
    var KEEP_MAX = 800, keep = new Map(), RE = /url\(["']?([^"')]+)["']?\)/g;
    function hold(src) {
      if (!src || src.slice(0, 5) === "data:" || src.slice(0, 5) === "blob:") return;
      if (keep.has(src)) { var o = keep.get(src); keep.delete(src); keep.set(src, o); return; }
      var im = new Image(); im.src = src; keep.set(src, im);
      if (im.decode) im.decode().catch(function () {});
      if (keep.size > KEEP_MAX) keep.delete(keep.keys().next().value);
    }
    function bg(el) { var st = el.getAttribute && el.getAttribute("style"); if (!st || st.indexOf("url(") < 0) return; var m; RE.lastIndex = 0; while ((m = RE.exec(st))) hold(new URL(m[1], location.href).href); }
    function scan(n) {
      if (n.nodeType !== 1) return;
      if (n.tagName === "IMG") hold(n.src); else bg(n);
      var a = n.getElementsByTagName("img"); for (var i = 0; i < a.length; i++) hold(a[i].src);
      if (n.querySelectorAll) { var b = n.querySelectorAll("[style*='url(']"); for (var j = 0; j < b.length; j++) bg(b[j]); }
    }
    new MutationObserver(function (ms) {
      for (var i = 0; i < ms.length; i++) { var m = ms[i];
        if (m.type === "childList") for (var k = 0; k < m.addedNodes.length; k++) scan(m.addedNodes[k]);
        else if (m.attributeName === "src") hold(m.target.src); else bg(m.target); }
    }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["src", "style"] });
    scan(document.body);
  })();
</script>
<script>
  try { G.init(); } catch (e) {
    console.error(e);
    var boot = document.getElementById("boot"); if (boot) boot.remove();   // 别卡在「加载中…」
    var initErr = document.createElement("div");
    initErr.style.cssText = "background:#7a1f1f;color:#fff;padding:10px;font-size:14px;text-align:center";
    initErr.textContent = "启动失败（" + (e && e.message ? e.message : "未知错误") + "），请重试。";
    var initBtn = document.createElement("button");
    initBtn.textContent = "手动重试";
    initBtn.style.cssText = "margin-left:10px;padding:4px 14px;font-size:14px";
    initBtn.onclick = function () { location.reload(); };
    initErr.appendChild(initBtn);
    document.body.insertBefore(initErr, document.body.firstChild);
  }
</script>
