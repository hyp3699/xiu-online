
# 从 GitLab 手动同步代码到本仓库：保留 .github 工作流和仓库名
# 以下文件只以 GitHub 为准，同步时不删除、不覆盖：
#   android/xiu.keystore  安卓签名文件（换了签名，已装的 APK 就无法覆盖安装）
#   server-url.txt        打包 APK 用的服务器地址
# 仅在 Actions 页面手动点击 Run workflow 时执行
name: 同步GitLab

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-gitlab
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITLAB_REPO: https://gitlab.com/hepicpde-group/xiu.git
      GITLAB_BRANCH: main

    steps:
      - uses: actions/checkout@v4

      - name: 拉取 GitLab 代码并覆盖（保留 .github）
        run: |
          git clone --depth 1 -b "$GITLAB_BRANCH" "$GITLAB_REPO" /tmp/gl
          SHA=$(git -C /tmp/gl rev-parse --short HEAD)
          MSG=$(git -C /tmp/gl log -1 --pretty=%s)

          rsync -a --delete \
            --exclude .git \
            --exclude .github \
            --exclude /android/xiu.keystore \
            --exclude /server-url.txt \
            /tmp/gl/ ./

          git add -A

          if git diff --cached --quiet; then
            echo "已是最新（GitLab $SHA）"
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "同步 GitLab $SHA：$MSG"

          git push
          echo "已同步 GitLab $SHA"
